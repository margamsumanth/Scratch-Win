<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scratch & Win Arena</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">🎰 Scratch & Win Arena</div>
    <div class="nav-links">
      <button class="nav-btn active" id="cardsNavBtn" onclick="switchTab('cards')">My Cards</button>
      <button class="nav-btn" id="leaderboardNavBtn" onclick="switchTab('leaderboard')">Leaderboard</button>
      <button class="nav-btn" id="adminNavBtn" style="display:none" onclick="switchTab('admin')">Admin Panel</button>
    </div>
    <div id="userContainer"></div>
  </nav>

  <div class="container">
    <!-- Tab 1: Cards Wallet -->
    <div id="cardsTab" class="tab-content active">
      <div class="glass-panel">
        <h2>🎟️ My Scratch Cards</h2>
        <div id="cardsGrid" class="cards-grid"></div>
      </div>
    </div>

    <!-- Tab 2: Leaderboard -->
    <div id="leaderboardTab" class="tab-content">
      <div class="glass-panel">
        <h2>🏆 Top Winners Leaderboard</h2>
        <table id="leaderboardTable">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Player</th>
              <th>Total Won</th>
              <th>Wins</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Tab 3: Admin Panel -->
    <div id="adminTab" class="tab-content">
      <div class="glass-panel">
        <h2>⚙️ Admin Control Center</h2>
        <div id="adminStats"></div>
      </div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="modal-overlay">
    <div class="scratch-box" style="max-width: 400px; text-align: left;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <div style="display:flex; gap:1rem;">
          <h3 id="tabLogin" style="cursor:pointer; color:var(--primary-gold);" onclick="toggleAuthMode('login')">Login</h3>
          <h3 id="tabRegister" style="cursor:pointer; color:var(--text-muted);" onclick="toggleAuthMode('register')">Register</h3>
        </div>
        <button onclick="closeAuthModal()" class="btn-outline" style="padding:0.2rem 0.6rem;">✕</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="user@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-gold" style="width:100%; margin-top:1rem;">Login</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" onsubmit="handleRegister(event)" style="display:none">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" class="form-control" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="regEmail" class="form-control" placeholder="user@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-gold" style="width:100%; margin-top:1rem;">Register Account</button>
      </form>
    </div>
  </div>

  <!-- Scratch Canvas Modal -->
  <div id="scratchModal" class="modal-overlay">
    <div class="scratch-box">
      <h3>✨ Scratch to Reveal Your Prize!</h3>
      <div class="canvas-wrapper">
        <div class="scratch-underlay">
          <div id="prizeResultText">Checking...</div>
        </div>
        <canvas id="scratchCanvas" width="300" height="160" class="scratch-canvas"></canvas>
      </div>
      <button class="btn-outline" onclick="closeScratchModal()" style="margin-top:1rem;">Close Arena</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
